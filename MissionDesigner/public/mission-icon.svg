<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="32" fill="#080C16"/>
  <g transform="translate(32,32)">
    <!-- Planet body -->
    <circle cx="0" cy="0" r="12" fill="#F4F1DE"/>
    <!-- Ring behind -->
    <ellipse cx="0" cy="2" rx="20" ry="6" fill="none" stroke="#F4F1DE" stroke-width="2.5" stroke-dasharray="0 32 32 0" transform="rotate(-30)"/>
    <!-- Ring front -->
    <ellipse cx="0" cy="2" rx="20" ry="6" fill="none" stroke="#F4F1DE" stroke-width="2.5" stroke-dasharray="32 32" transform="rotate(-30)"/>
    <!-- Arrow (trajectory) — Cassini Gold -->
    <line x1="-6" y1="8" x2="14" y2="-14" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="14,-14 7,-10 11,-17" fill="#D4AF37"/>
  </g>
</svg>
