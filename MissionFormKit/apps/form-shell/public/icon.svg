<!-- Placeholder identity for the prototype shell. Colours mirror tokens/form.json
     color.light (accent #3b82f6 on surface #ffffff); pinned by manifest.test.ts. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="FormKit Shell">
  <rect width="192" height="192" rx="28" fill="#ffffff" />
  <rect x="8" y="8" width="176" height="176" rx="22" fill="none" stroke="#3b82f6" stroke-width="8" />
  <!-- Three stacked rows: a form document, reduced to its layout. -->
  <rect x="40" y="52" width="112" height="14" rx="7" fill="#3b82f6" />
  <rect x="40" y="89" width="112" height="14" rx="7" fill="#3b82f6" opacity="0.6" />
  <rect x="40" y="126" width="68" height="14" rx="7" fill="#3b82f6" opacity="0.35" />
</svg>
