<!-- Maskable variant: the OS may crop this to a circle/squircle, so everything that
     matters sits inside the safe zone (the central 80%, i.e. a 40% radius from centre).
     Hence the full-bleed accent field and the smaller glyph — a cropped edge loses
     nothing. Colours mirror tokens/form.json color.light, read live by vite.config.ts. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="Mission Pilot">
  <rect width="192" height="192" fill="#3b82f6" />
  <rect x="58" y="66" width="76" height="12" rx="6" fill="#ffffff" />
  <rect x="58" y="90" width="76" height="12" rx="6" fill="#ffffff" opacity="0.7" />
  <rect x="58" y="114" width="46" height="12" rx="6" fill="#ffffff" opacity="0.45" />
</svg>
